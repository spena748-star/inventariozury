<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventario IA con Convertidor de Tallas US/MX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#F1ECDE; --surface:#FBF8F1; --text:#221D16; --text-muted:#786F5E; --border:#DED3BB;
    --accent-price:#B87A24; --accent-primary:#1F4B43; --accent-primary-ink:#F1ECDE;
    --accent-ok:#3E6B52; --accent-ok-bg:#E2ECE3; --accent-low:#A85A22; --accent-low-bg:#F3E3D3;
    --accent-out:#96392A; --accent-out-bg:#F0DCD6; --danger:#96392A;
    --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono:'IBM Plex Mono', 'Courier New', monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#161C19; --surface:#1E2724; --text:#EDE8DA; --text-muted:#9C9284; --border:#303B36;
      --accent-price:#E3A94A; --accent-primary:#7FBFAE; --accent-primary-ink:#122320;
      --accent-ok:#8AC7A5; --accent-ok-bg:#20332A; --accent-low:#E3A16A; --accent-low-bg:#3A2C1E;
      --accent-out:#E58B78; --accent-out-bg:#3A2420;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;-webkit-font-smoothing:antialiased;}
  #app{max-width:640px;margin:0 auto;padding-bottom:100px;min-height:100vh;position:relative;}
  .topbar{padding:22px 18px 14px;border-bottom:1px solid var(--border);}
  .topbar-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .brand h1{font-family:var(--font-display);font-weight:600;font-size:26px;margin:0;letter-spacing:-0.01em;}
  .brand p{margin:2px 0 0;color:var(--text-muted);font-size:13px;}
  .icon-btn{background:none;border:1px solid var(--border);border-radius:8px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--text);cursor:pointer;flex:none;}
  .icon-btn:active{background:var(--border);}
  .stats{display:flex;gap:18px;margin-top:16px;font-family:var(--font-mono);}
  .stat b{display:block;font-size:17px;font-weight:600;line-height:1.2;}
  .stat span{display:block;font-family:var(--font-body);font-size:11px;color:var(--text-muted);margin-top:2px;}
  .search-row{display:flex;gap:8px;margin-top:16px;}
  .search-input{flex:1;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:10px 12px;font-size:14px;font-family:var(--font-body);}
  .search-input:focus{outline:2px solid var(--accent-primary);outline-offset:-1px;}
  .chips{display:flex;gap:8px;margin-top:12px;overflow-x:auto;padding-bottom:2px;}
  .chip{border:1px solid var(--border);background:transparent;color:var(--text-muted);border-radius:100px;padding:6px 13px;font-size:12.5px;font-family:var(--font-body);font-weight:500;white-space:nowrap;cursor:pointer;}
  .chip.active{background:var(--accent-primary);color:var(--accent-primary-ink);border-color:var(--accent-primary);}
  .list{padding:6px 18px 0;}
  .empty{text-align:center;padding:60px 20px;color:var(--text-muted);}
  .empty .glyph{font-size:34px;display:block;margin-bottom:10px;}
  .empty h3{font-family:var(--font-display);color:var(--text);font-weight:600;font-size:18px;margin:0 0 6px;}
  .empty p{font-size:13.5px;margin:0;line-height:1.5;}
  .row{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--border);cursor:pointer;}
  .thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;flex:none;background:var(--surface);border:1px solid var(--border);}
  .thumb-empty{width:56px;height:56px;border-radius:8px;flex:none;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--text-muted);}
  .row-main{flex:1;min-width:0;}
  .row-main h4{font-family:var(--font-display);font-weight:600;font-size:15.5px;margin:0 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row-meta{color:var(--text-muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row-side{text-align:right;flex:none;}
  .row-price{font-family:var(--font-mono);font-weight:600;font-size:15px;}
  .tag{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:100px;margin-top:4px;font-family:var(--font-body);}
  .tag-ok{background:var(--accent-ok-bg);color:var(--accent-ok);}
  .tag-low{background:var(--accent-low-bg);color:var(--accent-low);}
  .tag-out{background:var(--accent-out-bg);color:var(--accent-out);}
  .row-actions{display:flex;gap:6px;flex:none;}
  .row-actions button{border:1px solid var(--border);background:var(--surface);border-radius:7px;width:32px;height:32px;font-size:14px;cursor:pointer;color:var(--text);}
  .fab{position:fixed;right:18px;bottom:24px;width:56px;height:56px;border-radius:16px;background:var(--accent-primary);color:var(--accent-primary-ink);border:none;font-size:26px;box-shadow:0 6px 16px rgba(0,0,0,0.22);cursor:pointer;z-index:20;display:flex;align-items:center;justify-content:center;}
  .fab-wrap{max-width:640px;margin:0 auto;position:relative;}
  .overlay{position:fixed;inset:0;background:rgba(10,10,8,0.5);z-index:40;display:flex;align-items:flex-end;justify-content:center;}
  .overlay.hidden{display:none;}
  .sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:20px 18px 28px;position:relative;border-top:1px solid var(--border);}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .sheet-head h2{font-family:var(--font-display);font-size:20px;font-weight:600;margin:0;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-muted);margin-bottom:6px;}
  .field input[type=text],.field input[type=number],.field input[type=tel],.field input[type=password],.field select,.field textarea{width:100%;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:9px;padding:11px 12px;font-size:15px;font-family:var(--font-body);}
  .field textarea{resize:vertical;min-height:64px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .photo-picker{display:flex;align-items:center;gap:12px;}
  .photo-preview{width:76px;height:76px;border-radius:10px;object-fit:cover;background:var(--surface);border:1px solid var(--border);flex:none;}
  .photo-preview-empty{width:76px;height:76px;border-radius:10px;background:var(--surface);border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--text-muted);flex:none;}
  .btn{border:none;border-radius:10px;padding:13px 18px;font-size:14.5px;font-weight:600;font-family:var(--font-body);cursor:pointer;width:100%;}
  .btn-primary{background:var(--accent-primary);color:var(--accent-primary-ink);}
  .btn-ai{background:linear-gradient(135deg, #4285F4, #9B51E0);color:#FFF;}
  .btn-ghost{background:transparent;color:var(--text-muted);border:1px solid var(--border);}
  .btn-danger{background:transparent;color:var(--danger);border:1px solid var(--accent-out-bg);}
  .btn-row{display:flex;gap:10px;margin-top:14px;}
  .btn-row .btn{width:auto;flex:1;}
  .file-input{display:none;}
  .platform-tabs{display:flex;gap:8px;margin-bottom:14px;}
  .ptab{flex:1;border:1px solid var(--border);background:transparent;color:var(--text-muted);border-radius:9px;padding:9px 4px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--font-body);}
  .ptab.active{background:var(--accent-primary);color:var(--accent-primary-ink);border-color:var(--accent-primary);}
  .caption-box{width:100%;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:9px;padding:12px;font-size:14px;font-family:var(--font-body);min-height:120px;white-space:pre-wrap;}
  .canvas-wrap{width:100%;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:var(--surface);border:1px solid var(--border);margin-bottom:14px;}
  .canvas-wrap canvas{width:100%;height:100%;display:block;}
  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:100px;font-size:13.5px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s ease;font-family:var(--font-body);max-width:88%;text-align:center;}
  .toast.show{opacity:1;}
  .margin-hint{font-family:var(--font-mono);font-size:12.5px;color:var(--text-muted);margin-top:6px;}
  .size-converter-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:14px;}
  .size-converter-box h5{margin:0 0 8px;font-size:12px;text-transform:uppercase;color:var(--text-muted);letter-spacing:0.5px;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="topbar-row">
      <div class="brand"><h1>Inventario IA</h1><p>Con convertidor de tallas US ➔ MX</p></div>
      <button class="icon-btn" id="btnSettings" title="Ajustes">⚙️</button>
    </div>
    <div class="stats">
      <div class="stat"><b id="statCount">0</b><span>productos</span></div>
      <div class="stat"><b id="statUnits">0</b><span>unidades</span></div>
      <div class="stat"><b id="statValue">$0</b><span>valor inventario</span></div>
    </div>
    <div class="search-row"><input class="search-input" id="searchInput" type="text" placeholder="Buscar producto, categoría o talla…"></div>
    <div class="chips" id="filterChips">
      <button class="chip active" data-filter="todos">Todos</button>
      <button class="chip" data-filter="stock">En stock</button>
      <button class="chip" data-filter="pocas">Pocas piezas</button>
      <button class="chip" data-filter="agotado">Agotado</button>
    </div>
  </div>
  <div class="list" id="list"></div>
  <div class="fab-wrap"><button class="fab" id="btnAdd" title="Agregar producto">+</button></div>
</div>

<!-- MODAL FORMULARIO DE PRODUCTO CON GEMINI IA (3.6 FLASH) Y CONVERTIDOR DE TALLAS -->
<div class="overlay hidden" id="formOverlay">
  <div class="sheet">
    <div class="sheet-head"><h2 id="formTitle">Nuevo producto</h2><button class="icon-btn" data-close="formOverlay">✕</button></div>
    <form id="productForm">
      <div class="field"><label>Foto del producto</label>
        <div class="photo-picker">
          <img id="photoPreview" class="photo-preview" style="display:none;">
          <div id="photoPreviewEmpty" class="photo-preview-empty">📷</div>
          <div style="flex:1;display:flex;flex-direction:column;gap:6px;">
            <div style="display:flex;gap:6px;">
              <button type="button" class="btn btn-ghost" id="btnPickPhoto" style="padding:9px 12px;font-size:13px;">Seleccionar foto</button>
              <input class="file-input" type="file" id="photoInput" accept="image/*" capture="environment">
            </div>
            <button type="button" class="btn btn-ai" id="btnGeminiAnalyze" style="padding:9px 12px;font-size:13px;display:none;">⚡ Analizar con Gemini IA</button>
          </div>
        </div>
      </div>
      
      <div class="field"><label>Nombre del producto *</label><input type="text" id="fName" required placeholder="Ej. Tenis Nike Air Max"></div>
      
      <div class="field-row">
        <div class="field"><label>Categoría</label>
          <select id="fCategory"><option>Calzado</option><option>Ropa</option><option>Bolsas</option><option>Belleza</option><option>Accesorios</option><option>Hogar</option><option>Otro</option></select>
        </div>
        <div class="field"><label>Departamento</label>
          <select id="fDept"><option value="hombre">Hombre / Men</option><option value="dama">Dama / Women</option><option value="nino">Niño / Boys</option><option value="nina">Niña / Girls</option><option value="bebe">Bebé / Baby</option></select>
        </div>
      </div>

      <!-- SECCIÓN CONVERTIDOR AUTOMÁTICO DE TALLAS US/MX -->
      <div class="size-converter-box">
        <h5>👟👕 Convertidor de Tallas Automático</h5>
        <div class="field-row" style="margin-bottom:0;">
          <div class="field" style="margin-bottom:0;"><label>Talla EE.UU. (US)</label><input type="text" id="fSizeUS" placeholder="Ej. 10, 8.5, M, 4T, 2Y"></div>
          <div class="field" style="margin-bottom:0;"><label>Equivalente MX (Auto)</label><input type="text" id="fSizeMX" readonly placeholder="Auto..." style="background:var(--bg);font-weight:700;color:var(--accent-price);"></div>
        </div>
      </div>

      <div class="field-row">
        <div class="field"><label>Existencias *</label><input type="number" id="fStock" min="0" step="1" required placeholder="1"></div>
        <div class="field"><label>Precio de venta (MXN) *</label><input type="number" id="fPrice" min="0" step="0.01" required placeholder="0.00"></div>
      </div>

      <div class="field"><label>Costo de compra (opcional)</label><input type="number" id="fCost" min="0" step="0.01" placeholder="0.00"></div>
      <div class="margin-hint" id="marginHint"></div>

      <div class="field" style="margin-top:12px;"><label>Detalles adicionales (color, material, notas)</label><textarea id="fDetails" placeholder="Ej. Blancos con negro, sin caja original"></textarea></div>

      <div class="btn-row" style="margin-top:20px;">
        <button type="button" class="btn btn-danger" id="btnDelete" style="display:none;flex:0.6;">Eliminar</button>
        <button type="submit" class="btn btn-primary" id="btnSave">Guardar producto</button>
      </div>
    </form>
  </div>
</div>

<!-- MODAL PUBLICAR EN REDES SOCIALES -->
<div class="overlay hidden" id="publishOverlay">
  <div class="sheet">
    <div class="sheet-head"><h2>Publicación Lista para Redes</h2><button class="icon-btn" data-close="publishOverlay">✕</button></div>
    <div class="platform-tabs" id="platformTabs">
      <button class="ptab active" data-platform="instagram">Instagram</button>
      <button class="ptab" data-platform="facebook">Facebook</button>
      <button class="ptab" data-platform="whatsapp">WhatsApp</button>
    </div>
    
    <!-- CANVAS DONDE SE DISEÑA LA FOTO EN TIEMPO REAL -->
    <div class="canvas-wrap"><canvas id="publishCanvas"></canvas></div>

    <!-- BOTÓN PRINCIPAL PARA PUBLICAR FOTO EDITADA + TEXTO + HASHTAGS -->
    <button class="btn btn-ai" id="btnShareAll" style="padding:15px;font-size:15px;margin-bottom:14px;">🚀 Compartir Publicación Completa (Foto + Texto)</button>

    <div class="btn-row" style="margin-top:0;margin-bottom:14px;">
      <button class="btn btn-ghost" id="btnDownloadImg" style="font-size:12.5px;">⬇️ Solo Foto Editada</button>
      <button class="btn btn-ghost" id="btnCopyCaption" style="font-size:12.5px;">📋 Solo Texto y Hashtags</button>
    </div>
    
    <label style="display:block;font-size:12.5px;font-weight:600;color:var(--text-muted);margin-bottom:6px;">Vista previa del texto y hashtags</label>
    <div class="caption-box" id="captionBox"></div>
  </div>
</div>

<!-- MODAL CONFIGURACIÓN Y API KEY -->
<div class="overlay hidden" id="settingsOverlay">
  <div class="sheet">
    <div class="sheet-head"><h2>Ajustes y Gemini API</h2><button class="icon-btn" data-close="settingsOverlay">✕</button></div>
    <form id="settingsForm">
      <div class="field"><label>Gemini API Key (Google AI Studio)</label><input type="password" id="sGeminiKey" placeholder="Pega tu API Key de Gemini aquí"></div>
      <div class="field"><label>Nombre de tu negocio</label><input type="text" id="sBusinessName" placeholder="Ej. Mis Ventas"></div>
      <div class="field"><label>Ciudad / Ubicación</label><input type="text" id="sCity" placeholder="Ej. Ciudad Juárez, Chih."></div>
      <div class="field"><label>WhatsApp de contacto</label><input type="tel" id="sPhone" placeholder="Ej. 656 123 4567"></div>
      <button type="submit" class="btn btn-primary" style="margin-top:6px;">Guardar Ajustes</button>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "local_inventory_products";
  var SETTINGS_KEY = "local_inventory_settings";

  var products = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  var settings = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{"business_name":"","city":"","phone":"","gemini_key":""}');

  var currentFilter="todos", searchTerm="";
  var editingId=null, pendingPhotoBase64=null, currentPhotoUrl=null;
  var publishProduct=null, publishPlatform="instagram";
  var LOW_STOCK=2;

  function $(id){ return document.getElementById(id); }
  function money(n){ n=Number(n)||0; return "$"+n.toLocaleString('es-MX',{maximumFractionDigits:0}); }
  function toast(msg){ var t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._h); toast._h=setTimeout(function(){t.classList.remove("show");},3500); }
  function open(id){ $(id).classList.remove("hidden"); }
  function close(id){ $(id).classList.add("hidden"); }
  document.querySelectorAll("[data-close]").forEach(function(btn){ btn.addEventListener("click",function(){ close(btn.getAttribute("data-close")); }); });

  // LÓGICA DE CONVERSIÓN DE TALLAS AUTOMÁTICA US -> MX
  function convertSizeUS2MX(category, dept, sizeUS) {
    if(!sizeUS || !sizeUS.trim()) return "";
    var s = sizeUS.trim().toUpperCase();
    var num = parseFloat(s.replace(/[^0-9.]/g, ''));

    // 1. CALZADO / SHOES
    if (category === "Calzado") {
      if (isNaN(num)) return s;

      if (dept === "hombre") {
        var mx = num - 2;
        return (mx % 1 === 0 ? mx : mx.toFixed(1)) + " MX (" + num + " US)";
      } 
      else if (dept === "dama") {
        var mx = num - 3;
        return (mx % 1 === 0 ? mx : mx.toFixed(1)) + " MX (" + num + " US)";
      } 
      else if (dept === "nino" || dept === "nina") {
        if (s.indexOf("Y") > -1 || (num >= 1 && num <= 6.5 && s.indexOf("C") === -1 && num < 7)) {
          var mx = num + 19;
          return (mx % 1 === 0 ? mx : mx.toFixed(1)) + " MX (" + num + "Y US)";
        } else {
          var mx = num + 6;
          return (mx % 1 === 0 ? mx : mx.toFixed(1)) + " MX (" + num + "C US)";
        }
      } 
      else if (dept === "bebe") {
        var mx = num + 6;
        return (mx % 1 === 0 ? mx : mx.toFixed(1)) + " MX (" + num + " US)";
      }
    }

    // 2. ROPA / CLOTHING
    if (category === "Ropa") {
      if (s === "XS" || s === "XCH") return "XChica / XCH (28 MX)";
      if (s === "S" || s === "CH") return "Chica / CH (30 MX)";
      if (s === "M") return "Mediana / M (32 MX)";
      if (s === "L" || s === "G") return "Grande / G (34 MX)";
      if (s === "XL" || s === "EG") return "Extra Grande / EG (36-38 MX)";
      if (s === "XXL" || s === "2XL") return "2XL / 2EG (40 MX)";

      if (dept === "bebe") {
        if (s.indexOf("M") > -1 || !isNaN(num)) {
          return num + " Meses (" + num + "M US)";
        }
      }
      if (dept === "nino" || dept === "nina") {
        if (s.indexOf("T") > -1) {
          return num + " Años (Talla " + num + " MX)";
        }
        if (!isNaN(num)) {
          if (num <= 6) return num + " Años (Talla " + num + " MX)";
          if (num <= 16) return num + " Años (Talla " + num + "-" + (num+1) + " MX)";
        }
      }

      if (!isNaN(num)) {
        if (dept === "dama") {
          if (num === 0 || num === 2) return "Talla 3 / 24 MX (XCH)";
          if (num === 4 || num === 6) return "Talla 5-7 / 26-28 MX (CH-M)";
          if (num === 8 || num === 10) return "Talla 9-11 / 30-32 MX (M-G)";
          if (num === 12 || num === 14) return "Talla 13-15 / 34-36 MX (EG)";
        }
        if (dept === "hombre") {
          return "Talla " + num + " MX (" + num + 'in US)';
        }
      }
    }

    return s;
  }

  function updateSizeConversion(){
    var cat = $("fCategory").value;
    var dept = $("fDept").value;
    var sizeUS = $("fSizeUS").value;
    var mx = convertSizeUS2MX(cat, dept, sizeUS);
    $("fSizeMX").value = mx;
  }

  $("fSizeUS").addEventListener("input", updateSizeConversion);
  $("fCategory").addEventListener("change", updateSizeConversion);
  $("fDept").addEventListener("change", updateSizeConversion);

  function compressImage(base64Str, maxWidth, maxHeight, quality) {
    maxWidth = maxWidth || 400; maxHeight = maxHeight || 400; quality = quality || 0.5;
    return new Promise(function(resolve) {
      var img = new Image();
      img.onload = function() {
        var width = img.width, height = img.height;
        if (width > height) {
          if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; }
        } else {
          if (height > maxHeight) { width *= maxHeight / height; height = maxHeight; }
        }
        var canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = function() { resolve(base64Str); };
      img.src = base64Str;
    });
  }

  function saveData(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
      renderList();
      renderStats();
      return true;
    } catch(e) {
      console.error(e);
      toast("⚠️ Memoria local llena. Borra productos antiguos.");
      return false;
    }
  }

  function init(){
    $("sGeminiKey").value = settings.gemini_key || "";
    $("sBusinessName").value = settings.business_name || "";
    $("sCity").value = settings.city || "";
    $("sPhone").value = settings.phone || "";
    renderList();
    renderStats();
  }

  function renderStats(){
    var count=products.length, units=0, value=0;
    products.forEach(function(p){ units += Number(p.stock)||0; value += (Number(p.stock)||0)*(Number(p.price)||0); });
    $("statCount").textContent=count; $("statUnits").textContent=units; $("statValue").textContent=money(value);
  }

  function statusOf(p){ var s=Number(p.stock)||0; if(s<=0) return "out"; if(s<=LOW_STOCK) return "low"; return "ok"; }
  function passesFilter(p){
    var st=statusOf(p);
    if(currentFilter==="stock" && st==="out") return false;
    if(currentFilter==="pocas" && st!=="low") return false;
    if(currentFilter==="agotado" && st!=="out") return false;
    if(searchTerm){ 
      var hay=(p.name+" "+p.category+" "+(p.size_us||"")+" "+(p.size_mx||"")+" "+(p.details||"")).toLowerCase(); 
      if(hay.indexOf(searchTerm.toLowerCase())===-1) return false; 
    }
    return true;
  }
  function escapeHtml(s){ return String(s||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }

  function renderList(){
    var list=$("list");
    var visible=products.filter(passesFilter);
    if(products.length===0){ list.innerHTML='<div class="empty"><span class="glyph">🏷️</span><h3>Aún no hay productos</h3><p>Toca el botón + para agregar tu primer producto.</p></div>'; return; }
    if(visible.length===0){ list.innerHTML='<div class="empty"><span class="glyph">🔎</span><h3>Sin resultados</h3><p>Prueba con otro filtro o término de búsqueda.</p></div>'; return; }
    list.innerHTML = visible.map(function(p){
      var st=statusOf(p);
      var tagClass = st==="ok"?"tag-ok":st==="low"?"tag-low":"tag-out";
      var tagText = st==="ok"?"En stock":st==="low"?"Pocas piezas":"Agotado";
      var url = p.photo_url;
      var thumb = url ? '<img class="thumb" src="'+url+'">' : '<div class="thumb-empty">📦</div>';
      var sizeText = p.size_mx ? " · Talla: " + escapeHtml(p.size_mx) : (p.size_us ? " · Talla: " + escapeHtml(p.size_us) + " US" : "");

      return '<div class="row" data-id="'+p.id+'">'+thumb
        +'<div class="row-main"><h4>'+escapeHtml(p.name)+'</h4><div class="row-meta">'+escapeHtml(p.category||"") + sizeText + (p.details?" · "+escapeHtml(p.details):"")+'</div></div>'
        +'<div class="row-side"><div class="row-price">'+money(p.price)+'</div><span class="tag '+tagClass+'">'+tagText+'</span></div>'
        +'<div class="row-actions"><button data-publish="'+p.id+'" title="Publicar">📲</button></div></div>';
    }).join("");
    list.querySelectorAll(".row").forEach(function(row){ row.addEventListener("click",function(e){ if(e.target.closest("[data-publish]")) return; openEdit(row.getAttribute("data-id")); }); });
    list.querySelectorAll("[data-publish]").forEach(function(btn){ btn.addEventListener("click",function(e){ e.stopPropagation(); openPublish(btn.getAttribute("data-publish")); }); });
  }

  $("searchInput").addEventListener("input", function(e){ searchTerm=e.target.value; renderList(); });
  $("filterChips").addEventListener("click", function(e){
    var chip=e.target.closest(".chip"); if(!chip) return;
    document.querySelectorAll(".chip").forEach(function(c){c.classList.remove("active");});
    chip.classList.add("active"); currentFilter=chip.getAttribute("data-filter"); renderList();
  });

  $("btnAdd").addEventListener("click", function(){ openEdit(null); });

  function openEdit(id){
    editingId=id; pendingPhotoBase64=null;
    var p = id ? products.find(function(x){return x.id===id;}) : null;
    $("formTitle").textContent = p ? "Editar producto" : "Nuevo producto";
    $("btnDelete").style.display = p ? "block" : "none";
    $("btnSave").textContent = p ? "Guardar cambios" : "Guardar producto";
    $("fName").value = p ? p.name||"" : "";
    $("fCategory").value = p ? p.category||"Calzado" : "Calzado";
    $("fDept").value = p ? p.dept||"hombre" : "hombre";
    $("fSizeUS").value = p ? p.size_us||"" : "";
    $("fSizeMX").value = p ? p.size_mx||"" : "";
    $("fStock").value = p ? (p.stock!=null?p.stock:"1") : "1";
    $("fDetails").value = p ? p.details||"" : "";
    $("fPrice").value = p ? (p.price!=null?p.price:"") : "";
    $("fCost").value = p ? (p.cost!=null?p.cost:"") : "";
    currentPhotoUrl = p ? p.photo_url||null : null;
    updatePhotoPreview(currentPhotoUrl);
    updateMarginHint();
    updateSizeConversion();
    open("formOverlay");
  }

  function updatePhotoPreview(src){
    if(src){ 
      $("photoPreview").src=src; 
      $("photoPreview").style.display="block"; 
      $("photoPreviewEmpty").style.display="none"; 
      $("btnGeminiAnalyze").style.display="block";
    } else { 
      $("photoPreview").style.display="none"; 
      $("photoPreviewEmpty").style.display="flex"; 
      $("btnGeminiAnalyze").style.display="none";
    }
  }

  $("btnPickPhoto").addEventListener("click", function(){ $("photoInput").click(); });
  $("photoInput").addEventListener("change", function(e){
    var file=e.target.files[0]; if(!file) return;
    var reader = new FileReader();
    reader.onload = async function(evt){
      pendingPhotoBase64 = await compressImage(evt.target.result, 400, 400, 0.5);
      updatePhotoPreview(pendingPhotoBase64);
    };
    reader.readAsDataURL(file);
  });

  // ANALIZAR CON GEMINI IA (gemini-3.6-flash)
  $("btnGeminiAnalyze").addEventListener("click", async function(){
    if(!settings.gemini_key){
      toast("Agrega primero tu API Key de Gemini en Ajustes ⚙️");
      open("settingsOverlay");
      return;
    }
    var imgSrc = pendingPhotoBase64 || currentPhotoUrl;
    if(!imgSrc){ toast("Selecciona una foto primero"); return; }

    $("btnGeminiAnalyze").textContent = "⚡ Analizando…";
    $("btnGeminiAnalyze").disabled = true;

    try {
      var parts = imgSrc.split(',');
      var mimeType = "image/jpeg";
      if (parts[0].indexOf(":") > -1 && parts[0].indexOf(";") > -1) {
        mimeType = parts[0].substring(parts[0].indexOf(":") + 1, parts[0].indexOf(";"));
      }
      var base64Data = parts[1];

      var promptText = 'Analiza esta imagen de producto comercial. Responde ÚNICAMENTE en JSON válido sin formato markdown: {"name": "nombre corto del producto", "category": "Calzado|Ropa|Bolsas|Belleza|Accesorios|Hogar|Otro", "dept": "hombre|dama|nino|nina|bebe", "size_us": "talla detectada o vacio", "details": "detalles clave como modelo o color"}';

      // Petición HTTP actualizada a gemini-3.6-flash
      var response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=" + settings.gemini_key, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{
            parts: [
              { text: promptText },
              { inlineData: { mimeType: mimeType, data: base64Data } }
            ]
          }]
        })
      });

      var json = await response.json();
      if(!response.ok) throw new Error(json.error ? json.error.message : "Error HTTP " + response.status);

      var rawText = json.candidates[0].content.parts[0].text;
      var cleanJson = rawText.replace(/```json/gi, "").replace(/```/g, "").trim();
      var parsed = JSON.parse(cleanJson);

      if(parsed.name) $("fName").value = parsed.name;
      if(parsed.category) $("fCategory").value = parsed.category;
      if(parsed.dept) $("fDept").value = parsed.dept;
      if(parsed.size_us) $("fSizeUS").value = parsed.size_us;
      if(parsed.details) $("fDetails").value = parsed.details;

      updateSizeConversion();
      toast("⚡ ¡Analizado con éxito!");
    } catch(err) {
      console.error(err);
      toast("Error con Gemini: " + err.message);
    }

    $("btnGeminiAnalyze").textContent = "⚡ Analizar con Gemini IA";
    $("btnGeminiAnalyze").disabled = false;
  });

  $("fPrice").addEventListener("input", updateMarginHint);
  $("fCost").addEventListener("input", updateMarginHint);
  function updateMarginHint(){
    var price=parseFloat($("fPrice").value), cost=parseFloat($("fCost").value);
    if(!isNaN(price) && !isNaN(cost) && cost>=0){
      var margin=price-cost;
      $("marginHint").textContent="Ganancia estimada: "+money(margin)+(price>0?" ("+Math.round((margin/price)*100)+"%)":"");
    } else { $("marginHint").textContent=""; }
  }

  $("productForm").addEventListener("submit", function(e){
    e.preventDefault();
    var name=$("fName").value.trim();
    var price=parseFloat($("fPrice").value);
    var stock=parseInt($("fStock").value,10);
    if(!name || isNaN(price) || isNaN(stock)){ toast("Revisa nombre, precio y existencias"); return; }

    var photoUrl = pendingPhotoBase64 || currentPhotoUrl;

    var productPayload = {
      name: name,
      category: $("fCategory").value,
      dept: $("fDept").value,
      size_us: $("fSizeUS").value.trim(),
      size_mx: $("fSizeMX").value.trim(),
      details: $("fDetails").value.trim(),
      price: price,
      cost: $("fCost").value ? parseFloat($("fCost").value) : null,
      stock: stock,
      photo_url: photoUrl
    };

    if(editingId){
      var idx = products.findIndex(function(x){return x.id===editingId;});
      if(idx!==-1){ products[idx] = Object.assign(products[idx], productPayload); }
    } else {
      productPayload.id = "p_" + Date.now();
      products.unshift(productPayload);
    }

    if(saveData()){
      toast(editingId ? "Producto actualizado" : "Producto guardado");
      close("formOverlay");
    }
  });

  $("btnDelete").addEventListener("click", function(){
    if(!editingId) return;
    if(!confirm("¿Eliminar este producto de tu inventario?")) return;
    products = products.filter(function(x){return x.id!==editingId;});
    saveData();
    toast("Producto eliminado");
    close("formOverlay");
  });

  $("btnSettings").addEventListener("click", function(){ open("settingsOverlay"); });
  $("settingsForm").addEventListener("submit", function(e){
    e.preventDefault();
    settings = {
      gemini_key: $("sGeminiKey").value.trim(),
      business_name: $("sBusinessName").value.trim(),
      city: $("sCity").value.trim(),
      phone: $("sPhone").value.trim()
    };
    try {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
      toast("Ajustes guardados");
      close("settingsOverlay");
    } catch(err) {
      toast("Error al guardar ajustes");
    }
  });

  function openPublish(id){
    publishProduct = products.find(function(x){return x.id===id;});
    if(!publishProduct) return;
    publishPlatform="instagram";
    document.querySelectorAll(".ptab").forEach(function(t){ t.classList.toggle("active", t.getAttribute("data-platform")==="instagram"); });
    open("publishOverlay"); renderPublish();
  }
  $("platformTabs").addEventListener("click", function(e){
    var tab=e.target.closest(".ptab"); if(!tab) return;
    document.querySelectorAll(".ptab").forEach(function(t){t.classList.remove("active");});
    tab.classList.add("active"); publishPlatform=tab.getAttribute("data-platform"); renderPublish();
  });

  function stockLine(p){ var s=Number(p.stock)||0; if(s<=0) return "Agotado"; if(s<=LOW_STOCK) return "¡Últimas "+s+" piezas!"; return s+" disponibles"; }

  function buildCaption(p, platform){
    var price=money(p.price)+" MXN";
    var details=p.details?p.details.trim():"";
    var sizeText = p.size_mx ? "📏 Talla: " + p.size_mx : (p.size_us ? "📏 Talla US: " + p.size_us : "");
    var contact = settings.phone ? ("📲 Pedidos por WhatsApp: "+settings.phone) : "📲 Envíame mensaje privado para aparte";
    var location = settings.city ? ("📍 Entregas en: "+settings.city) : "";
    
    var catTag = (p.category || "Ventas").replace(/\s+/g, "");
    var tags = "#" + catTag + " #Ventas " + (settings.city ? "#" + settings.city.replace(/[^a-zA-Z0-9]/g, "") + " " : "") + "#Oferta #EnVenta #TiendaOnline";
    
    var lines=[];
    if(platform==="instagram"){
      lines.push("🔥 "+p.name.toUpperCase()+" 🔥");
      if(sizeText) lines.push("✨ "+sizeText);
      if(details) lines.push("📝 "+details);
      lines.push("💰 Precio: "+price);
      lines.push("📦 Disponible: "+stockLine(p));
      if(location) lines.push(location);
      lines.push("\n"+contact);
      lines.push("\n"+tags);
    } else if(platform==="facebook"){
      lines.push("🛍️ ¡DISPONIBLE PARA ENTREGA INMEDIATA!");
      lines.push("📌 "+p.name);
      if(sizeText) lines.push(sizeText);
      if(details) lines.push("📝 "+details);
      lines.push("💵 Precio: "+price);
      lines.push("📦 "+stockLine(p));
      if(location) lines.push(location);
      lines.push(contact);
      lines.push("\n"+tags);
    } else {
      lines.push("✨ *"+p.name+"*");
      if(sizeText) lines.push(sizeText);
      if(details) lines.push(details);
      lines.push("💰 *"+price+"* — "+stockLine(p));
      lines.push(contact);
    }
    return lines.filter(Boolean).join("\n");
  }

  function loadImg(src){ 
    return new Promise(function(resolve,reject){ 
      var img=new Image(); 
      if(src && !src.startsWith("data:")){ img.crossOrigin="anonymous"; }
      img.onload=function(){resolve(img);}; 
      img.onerror=function(e){reject(e);}; 
      img.src=src; 
    }); 
  }

  async function renderCanvas(p) {
    var canvas = $("publishCanvas");
    canvas.width = 1080; canvas.height = 1080;
    var ctx = canvas.getContext("2d");

    var bgGrad = ctx.createRadialGradient(540, 450, 100, 540, 540, 750);
    bgGrad.addColorStop(0, "#232A27");
    bgGrad.addColorStop(1, "#0E1311");
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, 1080, 1080);

    if (p.photo_url) {
      try {
        var img = await loadImg(p.photo_url);
        ctx.save();
        ctx.filter = "brightness(1.08) contrast(1.15) saturate(1.10)";

        var padding = 70;
        var maxW = 1080 - (padding * 2);
        var maxH = 750 - (padding * 2);
        var scale = Math.min(maxW / img.width, maxH / img.height);
        var w = img.width * scale;
        var h = img.height * scale;
        var x = (1080 - w) / 2;
        var y = padding + (maxH - h) / 2;

        ctx.shadowColor = "rgba(0, 0, 0, 0.55)";
        ctx.shadowBlur = 35;
        ctx.shadowOffsetY = 18;

        ctx.drawImage(img, x, y, w, h);
        ctx.restore();
      } catch (e) {
        console.error("Error al procesar foto:", e);
      }
    }

    var grad = ctx.createLinearGradient(0, 550, 0, 1080);
    grad.addColorStop(0, "rgba(14, 19, 17, 0)");
    grad.addColorStop(0.65, "rgba(14, 19, 17, 0.88)");
    grad.addColorStop(1, "rgba(14, 19, 17, 0.98)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 500, 1080, 580);

    if (p.size_mx || p.size_us) {
      var badgeText = "TALLA: " + (p.size_mx || (p.size_us + " US"));
      ctx.font = "600 24px Inter, sans-serif";
      var tw = ctx.measureText(badgeText).width;
      ctx.fillStyle = "rgba(31, 75, 67, 0.9)";
      roundRect(ctx, 40, 40, tw + 36, 48, 12);
      ctx.fill();
      ctx.fillStyle = "#F1ECDE";
      ctx.fillText(badgeText, 58, 73);
    }

    ctx.fillStyle = "#E3A94A";
    ctx.font = "700 92px Fraunces, serif";
    ctx.fillText(money(p.price), 56, 885);

    ctx.fillStyle = "#F1EDE3";
    ctx.font = "600 38px Inter, sans-serif";
    wrapText(ctx, p.name, 56, 948, 968, 44);

    var st = statusOf(p);
    if (st !== "ok") {
      var label = st === "out" ? "AGOTADO" : "ÚLTIMAS PIEZAS";
      ctx.font = "600 26px Inter, sans-serif";
      var pad = 20, tw = ctx.measureText(label).width;
      ctx.fillStyle = st === "out" ? "#96392A" : "#B87A24";
      roundRect(ctx, 1080 - tw - pad * 2 - 40, 40, tw + pad * 2, 50, 25);
      ctx.fill();
      ctx.fillStyle = "#F1EDE3";
      ctx.fillText(label, 1080 - tw - pad - 40, 75);
    }

    if (settings.business_name) {
      ctx.font = "500 26px Inter, sans-serif";
      ctx.fillStyle = "rgba(241,237,218,0.75)";
      ctx.fillText(settings.business_name.toUpperCase(), 56, 1025);
    }
  }

  function wrapText(ctx,text,x,y,maxWidth,lineHeight){
    var words=(text||"").split(" "),line="",lines=[];
    for(var i=0;i<words.length;i++){ var test=line+words[i]+" "; if(ctx.measureText(test).width>maxWidth && line){lines.push(line); line=words[i]+" ";} else line=test; }
    lines.push(line); lines=lines.slice(0,2);
    lines.forEach(function(l,i){ ctx.fillText(l.trim(),x,y+i*lineHeight); });
  }
  function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  async function renderPublish(){
    if(!publishProduct) return;
    $("captionBox").textContent = buildCaption(publishProduct, publishPlatform);
    await renderCanvas(publishProduct);
  }

  $("btnShareAll").addEventListener("click", function(){
    if(!publishProduct) return;
    var canvas = $("publishCanvas");
    var caption = $("captionBox").textContent;
    var fileName = (publishProduct.name || "producto").toLowerCase().replace(/[^a-z0-9]+/g, "-") + "-social.png";

    canvas.toBlob(async function(blob) {
      if(!blob){ toast("Error al procesar la imagen"); return; }
      var file = new File([blob], fileName, { type: "image/png" });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: publishProduct.name,
            text: caption
          });
          toast("¡Publicación enviada!");
        } catch (err) {
          if (err.name !== "AbortError") {
            fallbackShare(file, caption);
          }
        }
      } else {
        fallbackShare(file, caption);
      }
    }, "image/png");
  });

  function fallbackShare(file, caption) {
    navigator.clipboard.writeText(caption).then(function() {
      var url = URL.createObjectURL(file);
      var a = document.createElement("a");
      a.href = url; a.download = file.name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      toast("📋 Texto copiado y 🖼️ Foto descargada");
    }).catch(function() {
      toast("Descargando imagen...");
    });
  }

  $("btnCopyCaption").addEventListener("click", async function(){
    var text=$("captionBox").textContent;
    try{ await navigator.clipboard.writeText(text); toast("Texto y hashtags copiados"); }
    catch(e){ toast("Copia el texto manualmente"); }
  });

  $("btnDownloadImg").addEventListener("click", function(){
    var canvas=$("publishCanvas");
    canvas.toBlob(function(blob){
      if(!blob){ toast("Error al procesar la imagen"); return; }
      var name=(publishProduct.name||"producto").toLowerCase().replace(/[^a-z0-9]+/g,"-");
      var url=URL.createObjectURL(blob);
      var a=document.createElement("a"); a.href=url; a.download=name+"-social.png";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      toast("Imagen descargada");
    }, "image/png");
  });

  init();
})();
</script>
