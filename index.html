<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Remoción y Cambio de Fondo en Canvas</title>
  <style>
    canvas {
      border: 1px solid #ccc;
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>

  <canvas id="miCanvas" width="800" height="800"></canvas>

  <script type="module">
    import removeBackground from "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/+esm";

    /**
     * Procesa la imagen con la IA, remueve el fondo y dibuja la composición en el canvas.
     * @param {string} canvasId - ID del <canvas>
     * @param {string} urlArticulo - URL o DataURL de la imagen del producto
     * @param {string} nuevoFondo - Color Hex/RGB (ej: "#ffffff") o URL de una imagen de fondo
     */
    async function cambiarFondoArticulo(canvasId, urlArticulo, nuevoFondo) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext("2d");

      try {
        // 1. Remover el fondo mediante IA
        const blobTransparente = await removeBackground(urlArticulo, {
          fetchArgs: { mode: 'cors' }
        });

        // 2. Crear ObjectURL para la imagen sin fondo
        const urlSinFondo = URL.createObjectURL(blobTransparente);

        // 3. Cargar asíncronamente la imagen procesada
        const imgArticulo = await cargarImagen(urlSinFondo);

        // 4. Limpiar el Canvas
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 5. Dibujar Fondo y Producto en el orden correcto
        if (esColor(nuevoFondo)) {
          // Fondo de color sólido
          ctx.fillStyle = nuevoFondo;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          dibujarCentrado(ctx, imgArticulo, canvas.width, canvas.height);
        } else {
          // Fondo de imagen
          const imgFondo = await cargarImagen(nuevoFondo);
          ctx.drawImage(imgFondo, 0, 0, canvas.width, canvas.height);
          dibujarCentrado(ctx, imgArticulo, canvas.width, canvas.height);
        }

        // 6. Liberar memoria
        URL.revokeObjectURL(urlSinFondo);

      } catch (error) {
        console.error("Error al procesar y cambiar el fondo:", error);
      }
    }

    // Carga de imágenes con promesas y CORS habilitado
    function cargarImagen(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => resolve(img);
        img.onerror = (err) => reject(new Error(`No se pudo cargar la imagen: ${url}`));
        img.src = url;
      });
    }

    // Determina si el valor es un color sólido o una URL
    function esColor(valor) {
      return valor.startsWith("#") || valor.startsWith("rgb") || valor.startsWith("hsl");
    }

    // Escala y centra la imagen del producto sin deformarla
    function dibujarCentrado(ctx, img, canvasWidth, canvasHeight) {
      const ratio = Math.min(canvasWidth / img.width, canvasHeight / img.height);
      const nuevoAncho = img.width * ratio;
      const nuevoAlto = img.height * ratio;
      const posX = (canvasWidth - nuevoAncho) / 2;
      const posY = (canvasHeight - nuevoAlto) / 2;

      ctx.drawImage(img, 0, 0, img.width, img.height, posX, posY, nuevoAncho, nuevoAlto);
    }

    // EJEMPLO DE USO:
    // cambiarFondoArticulo("miCanvas", "https://tu-servidor.com/producto.jpg", "#f2f2f2");
    // cambiarFondoArticulo("miCanvas", "https://tu-servidor.com/producto.jpg", "https://tu-servidor.com/fondo.jpg");
  </script>
</body>
</html>
